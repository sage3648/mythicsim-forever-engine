name: Build and Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Upstream deploys to wowsims/pages-deploy with a token forks do not have, so this
# publishes to the repository's own Github Pages instead.
#
# The site is served from a subdirectory (/classic), and on a project page that sits
# under the repository name as well, so the prefix is a build input rather than
# something hard-coded. SITE_BASE defaults to /classic/ everywhere - the makefile, the
# vite config and the TypeScript all read it from one place - which is exactly what
# upstream serves, so nothing here changes their build. Set the SITE_BASE repository
# variable to override it; otherwise it is derived from the repository name.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A preview of forever-next under /<repo>/next/, built into the same Pages artifact (one site, one
  # deployment). It never holds up the live site: if it fails, this deploy just has no preview.
  build-next:
    if: github.repository == 'ElliotWood/Forever'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - name: Checkout forever-next
        uses: actions/checkout@v5
        with:
          ref: forever-next

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go plugin
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build forever-next
        env:
          SITE_BASE: /${{ github.event.repository.name }}/next/
        run: |
          make dist/forever/.dirstamp
          tools/site_base.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: next-site
          path: dist/forever
          retention-days: 1

  build-and-deploy:
    needs: build-next
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go plugin
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve the site base
        id: base
        run: echo "value=${SITE_BASE:-/${{ github.event.repository.name }}/classic/}" >> "$GITHUB_OUTPUT"
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}

      - name: Resolve the site repository
        id: repo
        run: echo "value=${SITE_REPO:-${{ github.repository }}}" >> "$GITHUB_OUTPUT"
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}

      - name: Build 🔧
        run: make dist/classic/.dirstamp
        env:
          SITE_BASE: ${{ steps.base.outputs.value }}
          SITE_REPO: ${{ steps.repo.outputs.value }}

      - name: Test
        run: make test

      # The Go tests and tsc both pass on a build whose pages throw at load, which has
      # shipped a blank site twice. Open every page before it is deployed.
      - name: Install a browser for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Open every page
        run: |
          mkdir -p "site$(dirname "$SITE_BASE")"
          ln -s "$PWD/dist/classic" "site${SITE_BASE%/}"
          python3 -m http.server 8080 --directory site >/dev/null 2>&1 &
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_pages.mjs
        env:
          SITE_BASE: ${{ steps.base.outputs.value }}

      - name: Add the root redirect
        run: cp deploy/root_index.html dist/index.html

      - name: Add the forever-next preview
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: next-site
          path: dist/next

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Github Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4

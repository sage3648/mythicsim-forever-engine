# Labels for pull requests from the paths they change. Priority, size, bug and
# enhancement need a person and stay manual.

"class: druid":
  - changed-files:
      - any-glob-to-any-file:
          - src/classes/druid.rs
          - src/classes/druid/**
          - tests/classes/druid.rs
          - tests/classes/druid/**
          - presets/druid/**


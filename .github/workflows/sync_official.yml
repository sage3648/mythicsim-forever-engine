name: Sync official branch

# Keeps `official` an exact, untouched copy of wowsims/forever master: a read-only reference we compare
# against. Nothing of ours ever goes on it. master and the live site are never touched, nothing deploys.
#
# It used to merge upstream into `official`, which let our own PRs (#258, #259) land there, so comparisons
# against it were comparing against a mix. Now it is force-set to upstream's exact commit every run.
#
# This file lives on master only because scheduled workflows run from the default branch.
#
# Known gap: the GITHUB_TOKEN may not push commits that change .github/workflows. When upstream edits a
# workflow the push is refused and the run opens an upstream-sync issue with the command to run by hand.
on:
    schedule:
        - cron: '41 */6 * * *'
    workflow_dispatch:

permissions:
    contents: write
    issues: write

concurrency:
    group: sync-official
    cancel-in-progress: false

jobs:
    mirror:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1

            - name: Point official at wowsims/forever master
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git fetch --no-tags https://github.com/wowsims/forever.git master
                  upstream=$(git rev-parse FETCH_HEAD)
                  if [ "$(git ls-remote origin refs/heads/official | cut -f1)" = "$upstream" ]; then
                      echo "official already at wowsims/forever $upstream"
                      exit 0
                  fi
                  if ! git push --force origin "$upstream:refs/heads/official"; then
                      title="upstream-sync: push refused for wowsims/forever $upstream"
                      body="The mirror could not push official, most likely because upstream changed a workflow file and the GITHUB_TOKEN may not push those. Run locally: \`git fetch https://github.com/wowsims/forever.git master && git push --force origin FETCH_HEAD:refs/heads/official\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                      gh label create upstream-sync --color d93f0b --description "wowsims/forever sync needs a human" 2> /dev/null || true
                      if [ -z "$(gh issue list --label upstream-sync --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
                          gh issue create --title "$title" --label upstream-sync --body "$body"
                      fi
                      exit 1
                  fi

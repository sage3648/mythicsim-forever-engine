name: Engine checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain input: the action installs the version pinned in rust-toolchain.toml.
      - name: Install Rust from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown, wasm32-wasip1
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --target wasm32-wasip1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache: false
      - run: go test ./...
        working-directory: tools/matched-go
      - run: go vet ./...
        working-directory: tools/matched-go
      - run: python3 -m unittest discover -s tools -p '*_test.py'
      - run: python3 tools/inventory.py check
      - run: python3 tools/prepared_v2.py check
      - run: python3 tools/upstream.py check

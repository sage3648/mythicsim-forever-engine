name: Engine checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build --locked --target wasm32-wasip1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false
      - run: go test ./...
        working-directory: tools/matched-go
      - run: go vet ./...
        working-directory: tools/matched-go
      - run: python3 -m unittest discover -s tools -p '*_test.py'
      - run: python3 tools/inventory.py check
      - run: python3 tools/prepared_v2.py check
      - run: python3 tools/upstream.py check

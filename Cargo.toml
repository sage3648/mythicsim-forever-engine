[package]
name = "forever-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental Frostbolt simulation kernel for MythicSim Forever"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
